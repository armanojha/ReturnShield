name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic, offline-friendly install behaviour.
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The supported runtime. Lambda runs nodejs20.x, so CI runs 20 only.
        node: ['20.11.1']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` fails if package-lock.json is missing or out of step with
      # package.json, which is what makes a fresh clone reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Proves the mirrored schemas still match the approved contract baseline
      # byte for byte. Any drift in contracts/ fails the build here.
      - name: Verify frozen contracts have not drifted
        run: npm run check:schemas

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

      - name: Build
        run: npm run build

      # Synthesis only. No AWS credentials are configured in CI, so this
      # validates the stack without deploying or touching an account.
      - name: Synthesize infrastructure
        run: npm run synth

  contracts-baseline:
    name: Frozen contract verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      # The frozen baseline is re-verified on every change so application work
      # cannot quietly alter an approved contract.
      - name: Verify frozen contracts
        run: python product/verify_contracts.py
